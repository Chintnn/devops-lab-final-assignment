apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-backend
  labels:
    app: payment-backend
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-backend
      tier: backend
  template:
    metadata:
      labels:
        app: payment-backend
        tier: backend
    spec:
      containers:
        - name: payment-backend
          image: nginx:alpine
          ports:
            - containerPort: 80